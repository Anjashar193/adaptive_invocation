[project]
name = "adaptive-invocation"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "numpy>=2.5.1",
    "sentence-transformers>=5.6.1",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[tool.pytest.ini_options]
# tests import `src.…` and read the CSVs by relative path, so they run from
# the repo root
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
